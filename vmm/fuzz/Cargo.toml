[package]
name = "fevvm-fuzz"
version = "0.0.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
fevvm = { path = "../fevvm", features = ["fuzzing"] }
fileshare = { path = "../fileshare", features = ["testing"] }
libfuzzer-sys = "0.4"

[workspace]

[[bin]]
name = "queue"
path = "fuzz_targets/queue.rs"
test = false
doc = false
bench = false

